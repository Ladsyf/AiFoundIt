<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiFoundIt pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0E0C0A; }
  * { box-sizing: border-box; }
  #root, #over { position: absolute; inset: 0; overflow: hidden; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block;
    font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; overflow: hidden; }
  .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .hd { font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; }
  .tx { font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .ph { font-family: Roboto, 'Segoe UI', sans-serif; }
  .mono { font-family: 'Roboto Mono', Consolas, monospace; }
  .a { position: absolute; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<img src="../../assets/images/icon.png" alt="" style="position:absolute;left:-9999px;width:160px;height:160px">
<div id="root"></div>
<div id="over"></div>
<script>
const C = {
  pri: '#FFB870', onPri: '#4A2800', priC: '#6A3C00', onPriC: '#FFDCBE', secC: '#4A3A2D', onSecC: '#F1E0D2',
  surf: '#151311', low: '#1D1B19', cont: '#221F1D', high: '#2C2927', highest: '#373431',
  on: '#E9E2DC', onv: '#CFC6BD', outline: '#999088', olv: '#4A4540',
  inv: '#E9E2DC', invOn: '#33302D', invPri: '#8B5000', bg: '#0E0C0A',
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = (t, a, b, fi = 0.45, fo = 0.4) => Math.min(eo(lin(t, a, a + fi)), 1 - eio(lin(t, b - fo, b)));

const S = { hook: [0, 5.8], reveal: [5.8, 9.6], f1: [9.6, 19.9], f2: [19.9, 28.1], f3: [28.1, 37.0], f4: [37.0, 47.6], proof: [47.6, 55.0], outro: [55.0, 60.0] };

const ic = (name, size, color, fill) =>
  `<span class="ms${fill ? ' fill' : ''}" style="font-size:${size}px;width:${size}px;height:${size}px;color:${color}">${name}</span>`;

// ───────────── thumbnails drawn as the screenshots they stand for ─────────────
const gcashThumb = (head, l1, l2, amount, l3) => `
  <div class="ph" style="position:absolute;inset:0;background:#F4F6FA;display:flex;flex-direction:column">
    <div style="background:#0A5BE0;color:#fff;font-size:10.5px;font-weight:700;padding:6px 9px;letter-spacing:.2px">GCash <span style="font-weight:400;opacity:.85;margin-left:4px">${head}</span></div>
    <div style="padding:8px 10px 0;display:flex;flex-direction:column;gap:3px">
      <div style="font-size:8.5px;color:#6B7280">${l1}</div>
      <div style="font-size:9.5px;font-weight:700;color:#1F2937" class="ell">${l2}</div>
      <div style="font-size:19px;font-weight:700;color:#111827;margin-top:2px">${amount}</div>
      <div style="font-size:7.5px;color:#9CA3AF;line-height:1.5">${l3}</div>
    </div>
  </div>`;
const jollibeeThumb = () => `
  <div class="ph" style="position:absolute;inset:0;background:#FFFDF8;display:flex;flex-direction:column">
    <div style="background:#D9232D;color:#fff;font-size:11px;font-weight:700;padding:5px 9px;display:flex;justify-content:space-between"><span>Jollibee</span><span style="font-weight:500;font-size:8.5px;opacity:.9;padding-top:2px">ORDER #4582</span></div>
    <div style="padding:7px 10px 0;font-size:8.5px;color:#3F3A34;line-height:1.75">
      <div style="display:flex;justify-content:space-between"><span>1-pc Chickenjoy w/ Rice</span><span>₱99.00</span></div>
      <div style="display:flex;justify-content:space-between"><span>Peach Mango Pie</span><span>₱48.00</span></div>
      <div style="display:flex;justify-content:space-between"><span>Coke Regular</span><span>₱55.00</span></div>
      <div style="border-top:1px dashed #C9C1B6;margin-top:3px;padding-top:3px;display:flex;justify-content:space-between;font-weight:700;font-size:10px;color:#1F1B17"><span>TOTAL</span><span>₱202.00</span></div>
    </div>
  </div>`;
const videoThumb = () => {
  const candles = [-22, 0, 22].map((dx, i) => `
    <div class="a" style="left:${83 + dx - 2}px;top:58px;width:4px;height:17px;border-radius:2px;background:${['#F7A8C4', '#9FD3F7', '#FBE38E'][i]}"></div>
    <div class="a" style="left:${83 + dx - 5}px;top:44px;width:10px;height:15px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#FFF7D6 0%,#FFC24A 55%,rgba(255,140,40,0) 75%);box-shadow:0 0 16px 6px rgba(255,190,90,.35)"></div>`).join('');
  const bokeh = [[18, 22, 18, .22], [140, 18, 26, .16], [128, 70, 14, .2], [30, 82, 20, .12], [70, 12, 10, .2]]
    .map(([x, y, s, o]) => `<div class="a" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:rgba(255,196,120,${o})"></div>`).join('');
  return `
  <div style="position:absolute;inset:0;background:radial-gradient(120px 90px at 50% 60%,#5A3A22 0%,#2A1B12 60%,#160F0B 100%)">
    ${bokeh}
    <div class="a" style="left:43px;top:74px;width:80px;height:34px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,#FBE9F0 0 30%,#F2B8CB 30% 100%)"></div>
    <div class="a" style="left:36px;top:104px;width:94px;height:7px;border-radius:4px;background:#E7DCCF"></div>
    ${candles}
    <div class="a" style="left:63px;top:42px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;opacity:.0"></div>
    <div class="a ph" style="right:7px;bottom:7px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:500;letter-spacing:.4px;border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:2px">${ic('play_arrow', 13, '#fff', true)}0:48</div>
  </div>`;
};

// ───────────── phone UI pieces (dark theme from src/constants/theme.ts) ─────────────
const fileCard = (f, p, id) => `
  <div ${id ? `id="${id}"` : ''} class="ph" style="flex:1;min-width:0;border:1px solid ${C.olv};border-radius:12px;background:${C.surf};padding:8px;display:flex;flex-direction:column;gap:8px;opacity:${p};transform:translateY(${(1 - p) * 14}px) scale(${0.96 + 0.04 * p})">
    <div ${id ? `id="${id}-th"` : ''} style="height:128px;border-radius:6px;overflow:hidden;position:relative">${f.thumb}</div>
    <div style="padding:0 4px 4px;display:flex;flex-direction:column;gap:2px">
      <div class="ell" style="font-size:14px;font-weight:500;line-height:20px;letter-spacing:.1px;color:${C.on}">${f.name}</div>
      <div class="ell" style="font-size:12px;line-height:16px;letter-spacing:.4px;color:${C.onv}">${f.meta}</div>
    </div>
  </div>`;
const grid = (cards) => {
  let rows = '';
  for (let i = 0; i < cards.length; i += 2) {
    const r = cards.slice(i, i + 2);
    rows += `<div style="display:flex;gap:12px">${r.join('')}${r.length === 1 ? '<div style="flex:1"></div>' : ''}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:12px">${rows}</div>`;
};
const bubble = (txt) => `<div style="display:flex;justify-content:flex-end"><div class="ph" style="max-width:82%;background:${C.high};border-radius:20px;border-bottom-right-radius:4px;padding:12px 16px;font-size:16px;line-height:24px;letter-spacing:.25px;color:${C.on}">${txt}</div></div>`;
const spinner = (t) => `<svg width="20" height="20" viewBox="0 0 24 24" style="transform:rotate(${t * 400}deg)"><circle cx="12" cy="12" r="9" stroke="${C.pri}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-dasharray="${30 + 16 * Math.sin(t * 5)} 100"/></svg>`;
const searching = (t) => `<div class="ph" style="display:flex;align-items:center;gap:12px;height:28px">${spinner(t)}<span style="font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.onv}">Searching this phone…</span></div>`;
const words = (txt, t, a, rate) => {
  const w = txt.split(' ');
  return w.map((x, i) => `<span style="opacity:${clamp((t - a) * rate - i)}">${x}</span>`).join(' ');
};
const answer = (txt, t, a, rate = 26) => `<div class="ph" style="font-size:16px;line-height:24px;letter-spacing:.25px;color:${C.on}">${rate ? words(txt, t, a, rate) : txt}</div>`;
const totalCard = (id) => `<div id="${id}" class="ph" style="background:${C.priC};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px">
  <div style="font-size:22px;line-height:28px;color:${C.onPriC}">₱2,095.00</div>
  <div style="font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.onPriC}">3 receipts · GCash · summed in code</div></div>`;
const planCard = (state, press) => {
  const moved = state === 'moved';
  const rows = ['Screenshot_20261002_090812.png', 'Payslip_September2026.pdf', 'Passport_scan.pdf'].map((n) => `
    <div style="display:flex;align-items:center;gap:12px;height:32px;opacity:${moved ? 0.6 : 1}">${ic('check_box', 22, moved ? C.onv : C.pri, true)}<span class="ell" style="font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.onv};flex:1">${n}</span></div>`).join('');
  const foot = moved
    ? `<div style="display:flex;align-items:center;gap:10px">${ic('check_circle', 20, C.pri, true)}<span style="font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.on}">Moved 4 files to Documents/Private.</span></div>`
    : `<div style="font-size:12px;line-height:16px;letter-spacing:.4px;color:${C.onv}">Nothing is deleted. You can undo the move.</div>
       <div style="display:flex;justify-content:flex-end;gap:8px">
         <div style="height:40px;padding:0 12px;display:flex;align-items:center;font-size:14px;font-weight:500;letter-spacing:.1px;color:${C.pri}">Cancel</div>
         <div id="movebtn" style="height:40px;padding:0 24px;border-radius:20px;background:${C.pri};display:flex;align-items:center;font-size:14px;font-weight:500;letter-spacing:.1px;color:${C.onPri};transform:scale(${1 - 0.06 * press});filter:brightness(${1 - 0.12 * press})">Move 4 files</div>
       </div>`;
  return `<div id="plan" class="ph" style="border:1px solid ${C.olv};border-radius:16px;background:${C.low};padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:12px;align-items:flex-start">${ic('drive_file_move', 22, C.pri)}<div style="flex:1;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;color:${C.on}">Move 4 of 4 files to Documents/Private?</div></div>
    <div style="display:flex;flex-direction:column;gap:2px">${rows}<div style="font-size:14px;line-height:20px;color:${C.onv};padding:4px 0 0 34px">and 1 more</div></div>
    ${foot}</div>`;
};
const SUGGESTIONS = [
  ['screenshot', 'The screenshot with the wifi password'],
  ['receipt_long', 'Nasaan yung resibo ko sa Jollibee?'],
  ['description', 'The PDF about the thesis defense schedule'],
  ['photo', 'beach photo'],
  ['receipt_long', 'Magkano nagastos ko sa GCash this week?'],
  ['drive_file_move', 'Ilagay mo lahat ng resibo sa isang folder'],
];
const welcome = (tap) => `<div class="ph" style="position:absolute;left:0;right:0;bottom:0;padding:0 16px 12px;display:flex;flex-direction:column">
  <div style="font-size:24px;line-height:32px;color:${C.on}">What are you looking for?</div>
  <div style="font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.onv};margin:4px 0 20px">Describe it the way you’d remember it.</div>
  <div style="display:flex;flex-direction:column;gap:8px">${SUGGESTIONS.map(([i, s], k) => `
    <div ${k === 1 ? 'id="sug"' : ''} style="display:flex;align-items:center;gap:16px;min-height:52px;padding:12px 16px;border:1px solid ${k === 1 && tap > 0 ? C.pri : C.olv};border-radius:12px;background:${k === 1 ? `rgba(255,184,112,${0.1 * tap})` : 'transparent'}">${ic(i, 20, C.onv)}<span style="font-size:16px;line-height:24px;letter-spacing:.25px;color:${C.on}">${s}</span></div>`).join('')}</div></div>`;
const composer = (st) => `<div class="ph" style="flex:none;padding:8px 12px 10px;display:flex;align-items:flex-end;gap:8px">
  <div style="flex:1;min-height:56px;border-radius:28px;background:${C.high};padding:16px 20px;font-size:16px;line-height:24px;letter-spacing:.25px;color:${st.text ? C.on : C.onv}">${st.text || 'Describe a file'}${st.caret ? `<span style="display:inline-block;width:2px;height:20px;background:${C.pri};vertical-align:-4px;margin-left:1px"></span>` : ''}</div>
  <div id="send" style="flex:none;width:48px;height:48px;margin-bottom:4px;border-radius:24px;background:${st.canSend ? C.pri : 'rgba(233,226,220,.12)'};display:flex;align-items:center;justify-content:center;transform:scale(${1 - 0.08 * st.press})">${ic('arrow_upward', 24, st.canSend ? C.onPri : 'rgba(233,226,220,.38)')}</div></div>`;
const statusBar = (hl) => `<div class="ph" style="flex:none;height:40px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 28px">
  <span style="font-size:14px;font-weight:500;color:${C.on};letter-spacing:.2px">9:41</span>
  <span style="display:flex;align-items:center;gap:6px"><span id="plane" style="display:flex;border-radius:10px;padding:2px;box-shadow:0 0 0 ${2 * hl}px rgba(255,184,112,${hl}), 0 0 ${18 * hl}px rgba(255,184,112,${0.6 * hl})">${ic('flight', 17, hl > 0 ? C.pri : C.on, true)}</span>
  <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".6" y=".6" width="21" height="10.8" rx="3.2" fill="none" stroke="${C.on}" stroke-opacity=".6" stroke-width="1.2"/><rect x="2.4" y="2.4" width="15.5" height="7.2" rx="1.8" fill="${C.on}"/><rect x="22.6" y="3.8" width="1.8" height="4.4" rx=".9" fill="${C.on}" fill-opacity=".6"/></svg></span></div>`;
const appBar = () => `<div class="ph" style="flex:none;height:64px;display:flex;align-items:center;padding:0 8px">
  <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center">${ic('menu', 24, C.on)}</div>
  <div style="flex:1;font-size:22px;line-height:28px;color:${C.on};margin-left:4px">AiFoundIt</div>
  <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center">${ic('edit_square', 24, C.on)}</div></div>`;
const snackbar = (p) => `<div id="snack" class="ph" style="position:absolute;left:12px;right:12px;bottom:98px;min-height:48px;border-radius:8px;background:${C.inv};display:flex;align-items:center;padding:0 8px 0 16px;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:${p};transform:translateY(${(1 - p) * 18}px)">
  <span style="flex:1;font-size:14px;line-height:20px;letter-spacing:.25px;color:${C.invOn}">Moved 4 files to Documents/Private</span>
  <span id="undo" style="height:40px;padding:0 12px;display:flex;align-items:center;font-size:14px;font-weight:500;letter-spacing:.1px;color:${C.invPri}">Undo</span></div>`;

// ───────────── conversation timeline ─────────────
const G = (p, html, top = 12) => p <= 0.001 ? '' :
  `<div class="g" data-p="${p}" style="overflow:hidden;flex:none"><div style="padding-top:${top}px;opacity:${clamp(p * 1.3)};transform:translateY(${(1 - p) * 10}px)">${html}</div></div>`;
const grow = (t, a, d = 0.35) => eo(lin(t, a, a + d));
const blip = (t, a, b) => Math.min(eo(lin(t, a, a + 0.25)), 1 - eio(lin(t, b - 0.12, b + 0.12)));

const TYPED = [
  { text: 'Yung video na nag-blow ng candles si baby', start: 20.35, cps: 25, send: 22.2 },
  { text: 'Magkano nagastos ko sa GCash this week?', start: 28.55, cps: 25, send: 30.3 },
  { text: 'May picture ba ako ng ID ko?', start: 37.45, cps: 23, send: 38.85 },
];
const press = (t, at) => Math.sin(Math.PI * lin(t, at - 0.08, at + 0.2));
function composerState(t) {
  for (const q of TYPED) {
    if (t >= q.start && t < q.send + 0.06) {
      const n = Math.min(q.text.length, Math.floor((t - q.start) * q.cps));
      return { text: q.text.slice(0, n), caret: n < q.text.length || Math.floor(t * 2.4) % 2 === 0, canSend: n > 0, press: press(t, q.send) };
    }
  }
  return { text: '', caret: false, canSend: false, press: 0 };
}

const A1 = 'Found 2 Jollibee receipts. The latest is your ₱345.00 GCash payment at Jollibee SM Makati on Oct 8 [1].';
const A2 = 'This looks like the one: a birthday video from Aug 15 with candles [1].';
const A3 = 'You spent ₱2,095.00 on GCash across 3 receipts. Totals are summed in code, not by the model.';
const A4 = 'Found 4 files that look like IDs or credentials. I can move them to Documents/Private.';

const T1 = { send: 11.4, res: 12.85, ans: 13.45 };
const T2 = { send: 22.2, res: 23.55, ans: 24.05 };
const T3 = { send: 30.3, res: 31.45, ans: 32.55 };
const T4 = { send: 38.85, res: 39.95, ans: 40.45, move: 43.05 };

function chat(t) {
  let h = '';
  if (t >= T1.send) {
    h += G(grow(t, T1.send), bubble('Nasaan yung resibo ko sa Jollibee?'), 8);
    h += G(blip(t, T1.send + 0.25, T1.res), searching(t));
    h += G(grow(t, T1.res, 0.4), grid([
      fileCard({ name: 'Screenshot_20261008_121007.png', meta: 'Oct 8 · Screenshots', thumb: gcashThumb('Pay QR', 'Paid to', 'JOLLIBEE - SM MAKATI', '₱345.00', 'Ref. No. 8821 004 117233<br>Oct 8, 2026 12:10 PM') }, eo(lin(t, T1.res, T1.res + 0.45)), 'c1a'),
      fileCard({ name: 'Screenshot_20260928_115520.png', meta: 'Sep 28 · Screenshots', thumb: jollibeeThumb() }, eo(lin(t, T1.res + 0.15, T1.res + 0.6))),
    ]));
    h += G(grow(t, T1.ans, 0.3), answer(A1, t, T1.ans));
  }
  if (t >= T2.send) {
    h += G(grow(t, T2.send), bubble(TYPED[0].text), 24);
    h += G(blip(t, T2.send + 0.25, T2.res), searching(t));
    h += G(grow(t, T2.res, 0.4), grid([
      fileCard({ name: 'VID_20260815_candles.mp4', meta: 'Aug 15 · Camera', thumb: videoThumb() }, eo(lin(t, T2.res, T2.res + 0.45)), 'c2a'),
    ]));
    h += G(grow(t, T2.ans, 0.3), answer(A2, t, T2.ans));
  }
  if (t >= T3.send) {
    h += G(grow(t, T3.send), bubble(TYPED[1].text), 24);
    h += G(blip(t, T3.send + 0.25, T3.res), searching(t));
    h += G(grow(t, T3.res, 0.4), totalCard('total'));
    h += G(grow(t, T3.res + 0.3, 0.45), grid([
      fileCard({ name: 'Screenshot_20261009_184522.png', meta: 'Oct 9 · Screenshots', thumb: gcashThumb('Express Send', 'You sent', 'to MARIA SANTOS', '₱1,250.00', 'Ref. No. 4039 812 774211<br>Oct 9, 2026 6:45 PM') }, eo(lin(t, T3.res + 0.3, T3.res + 0.75))),
      fileCard({ name: 'Screenshot_20261008_121007.png', meta: 'Oct 8 · Screenshots', thumb: gcashThumb('Pay QR', 'Paid to', 'JOLLIBEE - SM MAKATI', '₱345.00', 'Ref. No. 8821 004 117233<br>Oct 8, 2026 12:10 PM') }, eo(lin(t, T3.res + 0.45, T3.res + 0.9))),
      fileCard({ name: 'Screenshot_20261005_201144.png', meta: 'Oct 5 · Screenshots', thumb: gcashThumb('Send Money', 'You sent', 'to JUAN DELA CRUZ', '₱500.00', 'Ref. No. 5512 889 003417<br>Oct 5, 2026 8:11 PM') }, eo(lin(t, T3.res + 0.6, T3.res + 1.05))),
    ]));
    h += G(grow(t, T3.ans, 0.35), answer(A3, t, T3.ans, 0));
  }
  if (t >= T4.send) {
    h += G(grow(t, T4.send), bubble(TYPED[2].text), 24);
    h += G(blip(t, T4.send + 0.25, T4.res), searching(t));
    h += G(grow(t, T4.res, 0.45), planCard(t >= T4.move + 0.12 ? 'moved' : 'pending', press(t, T4.move)));

  const gx = 50 + Math.sin(t * 0.21) * 6, gy = 46 + Math.cos(t * 0.17) * 5;
  const phoneSide = Math.min(eo(lin(t, S.f1[0], S.f1[0] + 1.2)), 1 - eio(lin(t, S.proof[0] - 0.3, S.proof[0] + 0.6)));
  const cx = gx + phoneSide * 18;
  const bg = `<div class="a" style="inset:0;background:radial-gradient(1300px 900px at ${cx}% ${gy}%,#2A1D12 0%,#16110D 50%,${C.bg} 100%)"></div>`;
  const vig = `<div class="a" style="inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.6);pointer-events:none"></div>`;
  let caps = '';
  for (const k of ['f1', 'f2', 'f3', 'f4']) caps += caption(t, k);
  document.getElementById('root').innerHTML = bg + hook(t) + reveal(t) + caps + progress(t) + phone(t) + proofScene(t) + outro(t) + vig;
  for (const g of document.querySelectorAll('.g')) g.style.height = g.firstElementChild.offsetHeight * Number(g.dataset.p) + 'px';
  document.getElementById('over').innerHTML = overlay(t);
}
window.render = render;
window.ready = Promise.all([
  document.fonts.load('24px "Material Symbols Outlined"', 'search'),
  document.fonts.load('400 16px Roboto'), document.fonts.load('500 16px Roboto'), document.fonts.load('700 16px Roboto'),
  document.fonts.load('500 16px "Roboto Mono"'),
]).then(() => document.fonts.ready).then(() => Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
render(0);
</script>
